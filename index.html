<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryann - UX e Dev Front-end</title>
    <!-- CSS compilado do SCSS | colocar o link correto, pois este vai dar erro, viu-->
    <link rel="stylesheet" href="css/style.css">
    <!-- Usando a fonte de icones aqui-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header>
        <div>
            <!-- LOGO + SLOGAN -->
            <div>
                <h1>
                    <a href="/"
                        title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte">
                        INSTITUTO FEDERAL
                    </a>
                </h1>
                <p>
                    Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                </p>
            </div>

            <!-- MENU HAMBÚRGUER (mobile) -->
            <button id="menuToggle" aria-label="Menu">
                <i class="ph ph-list"></i>
            </button>

            <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
            <nav aria-label="Navegação principal">
                <a href="#">Processos seletivos</a>
                <a href="#">Cursos</a>
                <a href="#">Campi</a>
                <a href="#">Institucional</a>
                <a href="#">Acesso à Informação</a>
                <a href="#">Eventos</a>
                <a href="#">Serviços</a>
            </nav>

            <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
            <div>
                <!-- Ícones sociais -->
                <div>
                    <a href="#" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a>
                    <a href="#" aria-label="Twitter"><i class="ph ph-twitter-logo"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
                    <a href="#" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
                    <a href="#" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
                    <a href="#" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
                </div>

                <!-- Busca -->
                <form method="get" action="/search/">
                    <input type="search" name="query" placeholder="Busca" aria-label="Busca" />
                    <button type="submit" aria-label="Pesquisar">
                        <i class="ph ph-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Alto contraste -->
                <button id="altocontraste" type="button" aria-label="Alto contraste">
                    <i class="ph ph-contrast"></i>
                </button>

                <!-- Modo escuro -->
                <button type="button" aria-label="Modo escuro">
                    <i class="ph ph-moon"></i>
                </button>
            </div>
        </div>
    </header>

</body>

</html>
